<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        const _defineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          try {
            if (obj === window && prop === 'fetch' && descriptor && typeof descriptor === 'object' && descriptor.get && !descriptor.set) {
              let currentVal = descriptor.get();
              descriptor.set = function(val) { currentVal = val; };
              descriptor.get = function() { return currentVal; };
              descriptor.configurable = true;
            }
          } catch (e) {}
          return _defineProperty(obj, prop, descriptor);
        };
      } catch (e) {}
      
      // Global error listener to prevent blank white screen on mobile
      window.addEventListener('error', function(e) {
        console.error('Global error caught:', e.message, e.filename, e.lineno);
        var root = document.getElementById('root');
        if (root && root.innerHTML.indexOf('Đang tải ứng dụng') !== -1) {
          setTimeout(function() {
            if (root && root.innerHTML.indexOf('Đang tải ứng dụng') !== -1) {
              root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;background:#f8fafc;padding:24px;text-align:center;">' +
                '<div style="font-size:36px;margin-bottom:12px;">🏥</div>' +
                '<h2 style="color:#1e40af;font-size:17px;font-weight:bold;margin-bottom:8px;">HỆ THỐNG ĐIỂM DANH BVĐK THIỆU HÓA</h2>' +
                '<p style="color:#64748b;font-size:13px;max-width:320px;line-height:1.5;margin-bottom:20px;">Đã xảy ra sự cố khi tải ứng dụng trên thiết bị. Vui lòng bấm nút bên dưới để tải lại.</p>' +
                '<button onclick="window.location.reload(true)" style="padding:12px 24px;background:#1e40af;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(30,64,175,0.3);">Tải lại ứng dụng</button>' +
                '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(ex){}window.location.reload(true)" style="margin-top:12px;background:none;border:none;color:#64748b;font-size:12px;text-decoration:underline;cursor:pointer;">Xóa bộ nhớ đệm & Tải lại</button>' +
                '</div>';
            }
          }, 3500);
        }
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ứng dụng điểm danh tại Bệnh viện đa khoa Thiệu Hóa." />
    <meta property="og:title" content="Hệ thống Điểm danh GPS - Bệnh viện Đa khoa Thiệu Hóa" />
    <meta property="og:description" content="Ứng dụng điểm danh tại Bệnh viện đa khoa Thiệu Hóa." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Hệ thống Điểm danh GPS - Bệnh viện Đa khoa Thiệu Hóa</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-weight: 800; color: #1e40af; font-size: 16px; margin-bottom: 6px; letter-spacing: 0.5px;">HỆ THỐNG ĐIỂM DANH GPS</div>
        <div style="font-weight: 600; color: #475569; font-size: 13px; text-transform: uppercase; margin-bottom: 12px;">Bệnh Viện Đa Khoa Thiệu Hóa</div>
        <div style="color: #64748b; font-size: 12px;">Đang tải ứng dụng, vui lòng chờ trong giây lát...</div>
      </div>
      <style>
        @keyframes initial-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
